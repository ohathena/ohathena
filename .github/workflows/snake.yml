# Draws the arcade-coloured snake that eats your contribution graph.
# Runs every 12 hours (and on demand from the Actions tab), then publishes the SVG to the "output" branch.
name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-arcade.svg?color_snake=#ff2e88&color_dots=#1a1a2e,#0e4429,#3b7a12,#6fbf14,#9ef01a

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
